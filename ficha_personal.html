<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Personal</title>
    <link rel="stylesheet" href="ficha.css">
</head>

<body>

    <!-- Botón cerrar sesión (flotante) -->
    <button class="btn-logout" id="btnLogout">Cerrar sesión</button>

    <div class="container">
        <h1>Ficha Personal</h1>

        <!-- Imagen de perfil (opcional) -->
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
             class="profile-photo"
             alt="Foto de perfil">

        <div class="section">
            <div class="section-title">Nombre</div>
            <div class="data-box" id="nombre"></div>
        </div>

        <div class="section">
            <div class="section-title">RUT</div>
            <div class="data-box" id="rut"></div>
        </div>

        <div class="section">
            <div class="section-title">Rol</div>
            <div class="data-box" id="rol"></div>
        </div>

        <div class="section">
            <div class="section-title">Correo</div>
            <div class="data-box" id="correo"></div>
        </div>

        <div class="section">
            <div class="section-title">Carrera</div>
            <div class="data-box" id="carrera"></div>
        </div>

        <div class="section">
            <div class="section-title">Campus</div>
            <div class="data-box" id="campus"></div>
        </div>

        <div class="section">
            <div class="section-title">Departamento</div>
            <div class="data-box" id="departamento"></div>
        </div>

        <!-- Botón volver -->
        <button class="btn-volver" onclick="window.location.href='index.html'">
            Volver al Inicio
        </button>

    </div>

    <script type="module">
        import { protegerPagina, obtenerUID, cerrarSesion } from "./auth.js";
        import { db } from "./firebase.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

        protegerPagina();

        document.getElementById("btnLogout").onclick = cerrarSesion;

        obtenerUID(async (uid) => {
            const ref = doc(db, "users", uid);
            const snap = await getDoc(ref);

            if (!snap.exists()) {
                console.error("No existen datos en Firestore para este usuario.");
                return;
            }

            const datos = snap.data();

            document.getElementById("nombre").textContent = datos.Nombre || "";
            document.getElementById("rut").textContent = datos.Rut || "";
            document.getElementById("rol").textContent = datos.Rol || "";
            document.getElementById("correo").textContent = datos.Correo || "";
            document.getElementById("carrera").textContent = datos.Carrera || "";
            document.getElementById("campus").textContent = datos.Campus || "";
            document.getElementById("departamento").textContent = datos.Departamento || "";
        });
    </script>

</body>
</html>
