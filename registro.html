<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Nexo USM</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .register-box {
      background: white;
      width: 380px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    h2 {
      color: #002b5c;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #002b5c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
      font-weight: bold;
    }

    button:hover {
      background: #004a99;
    }

    .error {
      color: red;
      display: none;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="register-box">
    <h2>Crear Cuenta</h2>

    <input type="text" id="nombre" placeholder="Nombre completo">
    <input type="email" id="email" placeholder="Correo institucional">
    <input type="password" id="password" placeholder="Contraseña (mínimo 6 caracteres)">
    <input type="password" id="confirmar" placeholder="Confirmar contraseña">

    <button onclick="register()">Registrarse</button>

    <p id="msgError" class="error"></p>

    <p style="margin-top: 15px;">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
    </p>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

  <!-- Archivo con la configuración y funciones -->
  <script src="auth.js"></script>

</body>
</html>
